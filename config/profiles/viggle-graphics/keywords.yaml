must_run_queries:
  - 'site:arxiv.org ("human animation" OR "motion transfer") (video OR diffusion)'
  - 'site:arxiv.org ("identity preservation" OR "temporal consistency") "video generation"'
  - 'site:arxiv.org ("Gaussian Splatting" OR "neural rendering") (dynamic OR human OR avatar)'
  - 'site:arxiv.org ("3D reconstruction" OR "scene reconstruction") ("feed-forward" OR video OR "sparse-view" OR dynamic)'
  - 'site:arxiv.org ("structure from motion" OR "multi-view stereo" OR SLAM OR "camera pose") ("foundation model" OR transformer OR "real-time")'
  - 'site:arxiv.org ("dynamic scene reconstruction" OR "4D reconstruction") (video OR human OR interaction)'
  - 'site:arxiv.org ("interactive world model" OR "generative 3D world" OR "world simulator") (action-conditioned OR persistent OR navigable OR editable)'
  - 'site:arxiv.org ("world model" OR "world engine") ("3D representation" OR reconstruction OR "Gaussian Splatting" OR physics)'
  - '(site:worldlabs.ai OR site:deepmind.google OR site:research.nvidia.com) ("world model" OR "spatial intelligence" OR "3D world")'
  - 'site:mlsys.org (diffusion OR video OR visual) (serving OR GPU OR inference)'
  - '("video generation" OR diffusion) (serving OR streaming OR scheduling OR batching) GPU'

topic_tags:
  - { tag: 人物动画, match: [human animation, character animation, motion transfer, pose-guided] }
  - { tag: 身份一致性, match: [identity preservation, personalization, subject consistency] }
  - { tag: 时序一致性, match: [temporal consistency, flicker, long video] }
  - { tag: 可控视频, match: [controllable video, trajectory, camera control, motion control] }
  - { tag: Neural Rendering, match: [neural rendering, novel view synthesis, inverse rendering] }
  - { tag: 3DGS, match: [Gaussian Splatting, 3DGS, dynamic Gaussian] }
  - { tag: 3D重建, match: [3D reconstruction, scene reconstruction, sparse-view reconstruction, video-to-3D] }
  - { tag: 几何基础模型, match: [geometric foundation model, feed-forward reconstruction, pointmap, camera pose, depth estimation] }
  - { tag: SfM与SLAM, match: [structure from motion, multi-view stereo, visual SLAM, camera calibration] }
  - { tag: 动态4D重建, match: [dynamic scene reconstruction, 4D reconstruction, dynamic world, scene flow] }
  - { tag: 世界引擎, match: [world engine, world model, world simulator, generative 3D world, spatial intelligence] }
  - { tag: 可交互世界, match: [action-conditioned, interactive world, editable world, navigable world, persistent world, collision mesh, physics engine] }
  - { tag: Avatar, match: [avatar, talking head, human reconstruction, 4D human] }
  - { tag: 推理加速, match: [inference acceleration, distillation, few-step, quantization] }
  - { tag: GPU系统, match: [GPU scheduling, CUDA, Triton, sequence parallel, offload] }
  - { tag: 视频Pipeline, match: [NVENC, NVDEC, FFmpeg, codec, pipeline, streaming] }
  - { tag: 评测数据, match: [benchmark, dataset, evaluation, human preference] }

filters:
  date_window_days: 21
  max_items_total: 15
  max_items_per_dimension: 4
  require_primary_url: true
  prefer_code_or_project_page: true
  drop: [招聘, hiring, sponsored, 纯营销, 无方法细节的产品宣传]
