open_source_finance_quant_watchlist:
  search_queries:
    - "site:x.com open source AI trading agent GitHub"
    - "site:x.com quant agent GitHub LLM trading"
    - "site:x.com financial agent framework GitHub"
    - "site:x.com AI stock research agent GitHub"
    - "site:x.com DeFAI agent GitHub trading"
    - "site:github.com AI trading agent LLM quant"
    - "site:github.com financial agent LLM stock research"
  seed_projects:
    - "TradingAgents"
    - "Vibe-Trading"
    - "UZI-Skill"
    - "QuantDinger"
    - "daily_stock_analysis"
    - "QuantMind / LLMQuant"
  selection_rule: >
    开源项目不只看 GitHub stars。金融/量化 Agent 需要同时看：
    1) X 是否有真实讨论；2) 是否能实际跑数据/回测/推送；
    3) 是否有金融数据源或 broker/exchange 接口；
    4) 是否有 agent 架构/skill/工作流沉淀；
    5) 是否仍在活跃维护。星少但机制新、讨论早期升温的项目要标「潜力新星」。
