# ============================================================
# 研究雷达 research_radar.yaml
# 目的：补上「容易漏掉的高价值研究员长文 / 实验室研究页 / 国产模型论文」
# ============================================================

meta:
  version: 1
  updated: 2026-07-09
  owner_note: >
    这不是普通信源清单，而是每日调研前必须先扫的高优先级雷达。
    它用于发现没有进入官方新闻稿、但在 X Article、研究员博客、
    alignment/research 子站、Hugging Face model card、GitHub tech report 中
    正在被核心圈讨论的内容。

priority_policy:
  hard_priority_order:
    - researcher_longform_recent
    - lab_research_official
    - chinese_frontier_lab_release
    - paper_with_social_discussion
    - open_source_finance_quant_agent
  date_windows:
    researcher_longform_recent_days: 10
    lab_research_recent_days: 21
    chinese_lab_recent_days: 30
    paper_recent_days: 21
    oss_recent_days: 21
  daily_quotas:
    min_researcher_longform_or_lab_research: 2
    min_chinese_frontier_lab_checks: 3
    min_finance_quant_oss_candidates: 6
    min_finance_quant_oss_selected: 2
  source_weight:
    official_research_page: 1.0
    official_model_card_or_github: 0.95
    researcher_x_article: 0.92
    researcher_blog_or_newsletter: 0.9
    x_status_with_discussion: 0.82
    reputable_media_summary: 0.65
  fail_rule: >
    如果当天没有选入任何研究员长文/官方研究页/国产模型论文，
    必须在 dimensions[].notes 里写明「已扫但无入选」或「provider 受限」，
    不允许静默缺失。

longform_detail_policy:
  applies_to:
    - x_article
    - official_research
    - technical_report
    - model_card
    - long_blog
  min_detail_chars_zh: 650
  target_detail_chars_zh: 900
  max_detail_chars_zh: 1400
  required_sections:
    - 背景：这篇文章/论文在回答什么问题
    - 核心观点：作者真正想表达的 3-5 点
    - 方法/机制：如果有技术或工作流，讲清大致逻辑
    - 案例：给一个产品经理也能理解的例子
    - 价值：对 AI 产品、Agent 工程、评测或行业判断的启发
    - 边界：哪些结论还不能过度外推
  dashboard_rule: >
    对长文不要只写摘要。summary 负责 2-3 句小白版，
    detail 负责让用户不跳原文也能了解七七八八。
    如果原文很长，优先提炼结构、论证链和可复用方法，而不是逐段复述。

